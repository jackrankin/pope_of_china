[project]
name = "yuji"
version = "0.2.0"
description = "语迹 — a local MCP server that stores Chinese words (characters, pinyin, meaning) plus a pinyin quiz page."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
]

[project.scripts]
yuji = "yuji.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuji"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
